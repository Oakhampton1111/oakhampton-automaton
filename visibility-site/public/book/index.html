<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Book a Project Call | Oakhampton</title><style>body{margin:0;font:16px/1.65 Inter,system-ui;color:#102638;background:#f5f8f8}main{max-width:980px;margin:32px auto;background:#fff;padding:48px;border:1px solid #dce5e9;border-radius:18px}h1{font-size:48px;line-height:1.05}h2{margin-top:38px}a{color:#087c78}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:22px;border:1px solid #dce5e9;border-radius:14px}.btn{display:inline-block;padding:12px 16px;background:#102638;color:#fff;text-decoration:none;border-radius:8px}@media(max-width:700px){main{margin:0;padding:26px;border:0}.grid{grid-template-columns:1fr}h1{font-size:40px}}</style><meta name="description" content="Practical, fixed-scope AI automation and OpenClaw services from Oakhampton."><link rel="canonical" href="https://www.oakhampton.ai/automation-services/book/"><meta property="og:type" content="website"><meta property="og:site_name" content="Oakhampton Agent Desk"><meta property="og:title" content="Book a Project Call | Oakhampton"><meta property="og:description" content="Practical, fixed-scope AI automation and OpenClaw services from Oakhampton."><meta property="og:url" content="https://www.oakhampton.ai/automation-services/book/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Book a Project Call | Oakhampton"><meta name="twitter:description" content="Practical, fixed-scope AI automation and OpenClaw services from Oakhampton."><script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Oakhampton Capital Pty Ltd","url":"https://www.oakhampton.ai/","email":"customerservice@oakhampton.ai"}</script></head><body><main><p><a href="/automation-services/agent-desk/">← Agent Desk</a></p><h1>Book a Project Call</h1><p>For projects likely to exceed AUD $2,500</p><p>Use this route when the work spans multiple systems or business units. We review the brief before confirming a call.</p><form id="book"><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-10000px"><label>Name<br><input name="name" required></label><br><label>Work email<br><input name="email" type="email" required></label><br><label>Company<br><input name="company"></label><br><label>Project outcome<br><textarea name="problem" minlength="30" required style="width:100%;min-height:130px"></textarea></label><br><label>Expected budget<br><select name="budget"><option>AUD $2,500–5,000</option><option>AUD $5,000–10,000</option><option>AUD $10,000+</option></select></label><br><p><label><input type="checkbox" name="consent" required> I agree to the Privacy Policy and will not submit credentials or sensitive documents.</label></p><button class="btn" type="submit">Request project call</button><p id="status"></p></form><script>document.getElementById("book").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),problem=["High-value project call request","Name: "+f.get("name"),"Company: "+f.get("company"),"Budget: "+f.get("budget"),"",f.get("problem")].join("\n"),r=await fetch("/api/commerce/intake",{method:"POST",headers:{"content-type":"application/json","idempotency-key":e.target.dataset.idempotencyKey||(e.target.dataset.idempotencyKey=crypto.randomUUID())},body:JSON.stringify({email:f.get("email"),problem,offerId:"custom-agent",campaignId:"high-value-booking",language:"en",website:String(f.get("website")||"")})}),j=await r.json();document.getElementById("status").textContent=r.ok?"Request received. Reference: "+j.reference:"Please email customerservice@oakhampton.ai."}</script></main><script src="/automation-services/assets/concierge.js" defer></script></body></html>
